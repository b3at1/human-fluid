[project]
name = "human-fluid"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0,<2.1", "alembic>=1.15,<2", "pydantic-settings>=2.8,<3", "argon2-cffi>=23,<26", "httpx>=0.28,<1", "reasoning-gym==0.1.25"]
[dependency-groups]
dev = ["pytest>=8,<10", "hypothesis>=6,<7"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
